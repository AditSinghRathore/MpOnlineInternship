<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heart Disease Prediction API</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; background: #f7f7f9; }
  h1 { color: #b3282d; }
  form { background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  label { display: block; margin-top: 12px; font-size: 14px; font-weight: bold; }
  input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
  button { margin-top: 20px; padding: 10px 20px; background: #b3282d; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
  button:hover { background: #8f2024; }
  #result { margin-top: 20px; padding: 14px; border-radius: 8px; font-weight: bold; display: none; }
  .positive { background: #fde2e2; color: #a11; }
  .negative { background: #e2f7e6; color: #167a2e; }
</style>
</head>
<body>
  <h1>Heart Disease Risk Prediction</h1>
  <p>REST API for predicting heart disease risk from clinical parameters. Use this form or POST JSON to <code>/predict</code>.</p>

  <form id="predictForm">
    <label>Age</label><input type="number" name="age" value="55" required>
    <label>Sex (1 = male, 0 = female)</label><input type="number" name="sex" min="0" max="1" value="1" required>
    <label>Chest Pain Type (cp: 0-3)</label><input type="number" name="cp" min="0" max="3" value="0" required>
    <label>Resting Blood Pressure (trestbps)</label><input type="number" name="trestbps" value="130" required>
    <label>Cholesterol (chol)</label><input type="number" name="chol" value="240" required>
    <label>Fasting Blood Sugar &gt; 120 mg/dl (fbs: 1/0)</label><input type="number" name="fbs" min="0" max="1" value="0" required>
    <label>Resting ECG (restecg: 0-2)</label><input type="number" name="restecg" min="0" max="2" value="1" required>
    <label>Max Heart Rate Achieved (thalach)</label><input type="number" name="thalach" value="150" required>
    <label>Exercise Induced Angina (exang: 1/0)</label><input type="number" name="exang" min="0" max="1" value="0" required>
    <label>ST Depression (oldpeak)</label><input type="number" step="0.1" name="oldpeak" value="1.0" required>
    <label>Slope (0-2)</label><input type="number" name="slope" min="0" max="2" value="1" required>
    <label>Number of Major Vessels (ca: 0-4)</label><input type="number" name="ca" min="0" max="4" value="0" required>
    <label>Thal (0-3)</label><input type="number" name="thal" min="0" max="3" value="2" required>
    <button type="submit">Predict</button>
  </form>

  <div id="result"></div>

  <script>
    document.getElementById("predictForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const payload = {};
      formData.forEach((value, key) => payload[key] = parseFloat(value));

      const resultDiv = document.getElementById("result");
      resultDiv.style.display = "block";
      resultDiv.className = "";
      resultDiv.textContent = "Predicting...";

      try {
        const res = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.error) {
          resultDiv.textContent = "Error: " + data.error;
        } else {
          resultDiv.textContent = `${data.prediction} (risk probability: ${(data.risk_probability * 100).toFixed(1)}%)`;
          resultDiv.className = data.prediction.includes("Detected") ? "positive" : "negative";
        }
      } catch (err) {
        resultDiv.textContent = "Request failed: " + err;
      }
    });
  </script>
</body>
</html>
